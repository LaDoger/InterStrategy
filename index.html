<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterStrategy Font Playground</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta property="og:title" content="InterStrategy">
    <meta property="og:description" content="InterStrategy is a fork of the Inter font">
    <meta property="og:type" content="gallery">
    <meta property="og:url" content="https://ladoger.github.io/InterStrategy">
    <meta property="og:image" content="https://ladoger.github.io/InterStrategy/1200_600.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="600">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="InterStrategy">
    <meta name="twitter:description" content="InterStrategy is a fork of the Inter font">
    <meta name="twitter:image" content="https://ladoger.github.io/InterStrategy/1200_600.jpg">
    <meta name="twitter:site" content="@LaDoger21">

    <style>
        /* 1. FONT DEFINITIONS */
        @font-face {
            font-family: 'InterStrategy';
            src: url('InterStrategy-Regular.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }
        @font-face {
            font-family: 'InterStrategy';
            src: url('InterStrategy-Bold.ttf') format('truetype');
            font-weight: bold; font-style: normal;
        }
        @font-face {
            font-family: 'InterStrategy';
            src: url('InterStrategy-Italic.ttf') format('truetype');
            font-weight: normal; font-style: italic;
        }

        /* -- Color Variables -- */
        :root {
            --c-white: #ffffff;
            --c-black: #000000;
            --c-orange: #fa660f;
        }

        /* 2. GENERAL STYLES (Default Light Theme) */
        body {
            font-family: 'InterStrategy', sans-serif;
            background-color: var(--c-white);
            color: var(--c-black);
            max-width: 768px;
            margin: 2rem auto;
            padding: 0 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        /* 3. HEADER & TITLE */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: bold;
        }
        
        /* 4. ELEMENT STYLES */
        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 0;
            max-width: 65ch;
        }

        a {
            color: var(--c-black);
            font-weight: bold;
            text-decoration: underline;
            transition: color 0.3s ease-in-out;
        }

        .input-container {
            display: flex;
            margin: 1rem 0;
        }

        .text-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex; 
            background-color: var(--c-white);
            border: 3px solid var(--c-black);
            /* --- FIXED: The "border-right: none;" rule was removed from here --- */
            transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out;
        }
        
        #text-input {
            width: 100%;
            box-sizing: border-box; 
            padding: 0.75rem;
            font-size: 1.2rem;
            color: var(--c-black);
            font-family: 'InterStrategy', sans-serif;
            border-radius: 0;
            -webkit-appearance: none;
            border: none;
            background: transparent;
            outline: none;
            transition: color 0.3s ease-in-out;
        }
        
        #text-input::placeholder { color: transparent; }

        .placeholder-label {
            position: absolute;
            top: 50%;
            left: 0.75rem; 
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--c-black);
            opacity: 0.6;
            pointer-events: none; 
            transition: color 0.3s ease-in-out, opacity 0.2s ease-in-out;
        }

        #text-input:focus + .placeholder-label,
        #text-input:not(:placeholder-shown) + .placeholder-label {
            opacity: 0;
        }

        #add-symbol-btn {
            padding: 0.25rem 2rem;
            font-size: 2.5rem;
            border: 3px solid var(--c-black);
            border-left: none; /* This now correctly removes only the button's left border */
            background-color: var(--c-white);
            color: var(--c-black);
            cursor: pointer;
            font-family: 'InterStrategy', sans-serif;
            border-radius: 0;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out, border-color 0.3s ease-in-out;
        }

        .font-display {
            font-size: 3rem;
            margin: 1.2rem 0;
            line-height: 1.2;
            word-wrap: break-word;
            border-left: 3px solid var(--c-black);
            padding-left: 1rem;
            transition: border-left-color 0.3s ease-in-out;
        }
        .font-display.regular { font-weight: normal; font-style: normal; }
        .font-display.bold { font-weight: bold; }
        .font-display.italic { font-style: italic; }
        .font-display.half-size { font-size: 1.5rem; }
        .font-display.double-size { font-size: 6rem; }

        /* 5. THEME TOGGLE & THEME STYLES */
        #theme-toggle {
            width: 70px;
            height: 38px;
            background-color: var(--c-black);
            border-radius: 19px;
            border: none;
            cursor: pointer;
            position: relative;
            padding: 0;
            transition: background-color 0.3s ease-in-out;
            -webkit-appearance: none;
        }

        .knob {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 30px;
            height: 30px;
            background-color: var(--c-white);
            border-radius: 50%;
            transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

        .knob.slide-right { transform: translateX(32px); }
        
        /* --- THEME-SPECIFIC STYLES --- */

        /* -- Theme 2: White on Black -- */
        body[data-theme="dark"] { background-color: var(--c-black); color: var(--c-white); }
        body[data-theme="dark"] #theme-toggle { background-color: var(--c-white); }
        body[data-theme="dark"] .knob { background-color: var(--c-black); }
        body[data-theme="dark"] a { color: var(--c-white); }
        body[data-theme="dark"] .text-input-wrapper { background-color: var(--c-black); border-color: var(--c-white); }
        body[data-theme="dark"] #text-input { color: var(--c-white); }
        body[data-theme="dark"] .placeholder-label { color: var(--c-white); }
        body[data-theme="dark"] #add-symbol-btn { background-color: var(--c-black); color: var(--c-white); border-color: var(--c-white); }
        body[data-theme="dark"] .font-display { border-left-color: var(--c-white); }

        /* -- Theme 3: Orange on White -- */
        body[data-theme="orange-on-white"] { background-color: var(--c-white); color: var(--c-orange); }
        body[data-theme="orange-on-white"] #theme-toggle { background-color: var(--c-orange); }
        body[data-theme="orange-on-white"] .knob { background-color: var(--c-white); }
        body[data-theme="orange-on-white"] a { color: var(--c-orange); }
        body[data-theme="orange-on-white"] .text-input-wrapper { background-color: var(--c-white); border-color: var(--c-orange); }
        body[data-theme="orange-on-white"] #text-input { color: var(--c-orange); }
        body[data-theme="orange-on-white"] .placeholder-label { color: var(--c-orange); }
        body[data-theme="orange-on-white"] #add-symbol-btn { background-color: var(--c-white); color: var(--c-orange); border-color: var(--c-orange); }
        body[data-theme="orange-on-white"] .font-display { border-left-color: var(--c-orange); }
        
        /* -- Theme 4: Black on Orange -- */
        body[data-theme="black-on-orange"] { background-color: var(--c-orange); color: var(--c-black); }
        body[data-theme="black-on-orange"] #theme-toggle { background-color: var(--c-black); }
        body[data-theme="black-on-orange"] .knob { background-color: var(--c-orange); }
        body[data-theme="black-on-orange"] a { color: var(--c-black); }
        body[data-theme="black-on-orange"] .text-input-wrapper { background-color: var(--c-orange); border-color: var(--c-black); }
        body[data-theme="black-on-orange"] #text-input { color: var(--c-black); }
        body[data-theme="black-on-orange"] .placeholder-label { color: var(--c-black); }
        body[data-theme="black-on-orange"] #add-symbol-btn { background-color: var(--c-orange); color: var(--c-black); border-color: var(--c-black); }
        body[data-theme="black-on-orange"] .font-display { border-left-color: var(--c-black); }

        /* -- Theme 5: Orange on Black -- */
        body[data-theme="orange-on-black"] { background-color: var(--c-black); color: var(--c-orange); }
        body[data-theme="orange-on-black"] #theme-toggle { background-color: var(--c-orange); }
        body[data-theme="orange-on-black"] .knob { background-color: var(--c-black); }
        body[data-theme="orange-on-black"] a { color: var(--c-orange); }
        body[data-theme="orange-on-black"] .text-input-wrapper { background-color: var(--c-black); border-color: var(--c-orange); }
        body[data-theme="orange-on-black"] #text-input { color: var(--c-orange); }
        body[data-theme="orange-on-black"] .placeholder-label { color: var(--c-orange); }
        body[data-theme="orange-on-black"] #add-symbol-btn { background-color: var(--c-black); color: var(--c-orange); border-color: var(--c-orange); }
        body[data-theme="orange-on-black"] .font-display { border-left-color: var(--c-orange); }

        /* -- Theme 6: White on Orange -- */
        body[data-theme="white-on-orange"] { background-color: var(--c-orange); color: var(--c-white); }
        body[data-theme="white-on-orange"] #theme-toggle { background-color: var(--c-white); }
        body[data-theme="white-on-orange"] .knob { background-color: var(--c-orange); }
        body[data-theme="white-on-orange"] a { color: var(--c-white); }
        body[data-theme="white-on-orange"] .text-input-wrapper { background-color: var(--c-orange); border-color: var(--c-white); }
        body[data-theme="white-on-orange"] #text-input { color: var(--c-white); }
        body[data-theme="white-on-orange"] .placeholder-label { color: var(--c-white); }
        body[data-theme="white-on-orange"] #add-symbol-btn { background-color: var(--c-orange); color: var(--c-white); border-color: var(--c-white); }
        body[data-theme="white-on-orange"] .font-display { border-left-color: var(--c-white); }

        /* 6. RESPONSIVE DESIGN FOR MOBILE */
        @media (max-width: 600px) {
            body { margin-top: 1rem; }
            h1 { font-size: 2.5rem; }
            .font-display { font-size: 2rem; }
            .font-display.half-size { font-size: 1rem; }
            .font-display.double-size { font-size: 4rem; }
            #add-symbol-btn { padding: 0.75rem 1rem; }
            #theme-toggle { transform: scale(0.85); transform-origin: right center; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>InterStrategy</h1>
        <button id="theme-toggle" title="Toggle theme">
            <span id="theme-knob" class="knob"></span>
        </button>
    </div>

    <p class="description">
        Playground for the <b>InterStrategy</b> font. This font is identical to the <b>Inter</b> font with only one difference: The Bitcoin symbol (U+20BF) is now the Strategy ₿ symbol.
        <a href="https://github.com/LaDoger/InterStrategy" download>Download</a>
    </p>

    <div class="input-container">
        <div class="text-input-wrapper">
            <input type="text" id="text-input" placeholder="Type something..." aria-label="Text to display">
            <label for="text-input" class="placeholder-label">Type something...</label>
        </div>
        <button id="add-symbol-btn" title="Add ₿ Symbol">₿</button>
    </div>

    <!-- The text you type will appear here in the three font styles -->
    <div id="display-regular" class="font-display regular"></div>
    <div id="display-bold" class="font-display bold"></div>
    <div id="display-italic" class="font-display italic"></div>

    <div id="display-regular-half" class="font-display regular half-size"></div>
    <div id="display-bold-half" class="font-display bold half-size"></div>
    <div id="display-italic-half" class="font-display italic half-size"></div>
    
    <div id="display-regular-double" class="font-display regular double-size"></div>
    <div id="display-bold-double" class="font-display bold double-size"></div>
    <div id="display-italic-double" class="font-display italic double-size"></div>

    <script>
        // 7. JAVASCRIPT LOGIC
        
        // --- Theme Toggler Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeKnob = document.getElementById('theme-knob');
        const bodyEl = document.body;
        const themes = [
            'light', 'dark', 'orange-on-white', 'black-on-orange', 'orange-on-black', 'white-on-orange'
        ];
        
        function applyTheme(theme) {
            bodyEl.dataset.theme = theme;
            const newIndex = themes.indexOf(theme);
            
            if (newIndex % 2 !== 0) {
                themeKnob.classList.add('slide-right');
            } else {
                themeKnob.classList.remove('slide-right');
            }
            // Removed localStorage logic to prevent saving the theme
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = bodyEl.dataset.theme || 'light';
            const currentIndex = themes.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            const nextTheme = themes[nextIndex];
            applyTheme(nextTheme);
        });
        
        // --- Font Playground Logic ---
        const textInput = document.getElementById('text-input');
        const addSymbolBtn = document.getElementById('add-symbol-btn');
        const displayRegular = document.getElementById('display-regular');
        const displayBold = document.getElementById('display-bold');
        const displayItalic = document.getElementById('display-italic');
        const displayRegularHalf = document.getElementById('display-regular-half');
        const displayBoldHalf = document.getElementById('display-bold-half');
        const displayItalicHalf = document.getElementById('display-italic-half');
        const displayRegularDouble = document.getElementById('display-regular-double');
        const displayBoldDouble = document.getElementById('display-bold-double');
        const displayItalicDouble = document.getElementById('display-italic-double');
        const placeholderText = "The quick orange ₿adger jumps over the lazy Bear.";

        function updateDisplayText() {
            const textToShow = textInput.value || placeholderText;
            displayRegular.textContent = textToShow;
            displayBold.textContent = textToShow;
            displayItalic.textContent = textToShow;
            displayRegularHalf.textContent = textToShow;
            displayBoldHalf.textContent = textToShow;
            displayItalicHalf.textContent = textToShow;
            displayRegularDouble.textContent = textToShow;
            displayBoldDouble.textContent = textToShow;
            displayItalicDouble.textContent = textToShow;
        }

        // --- Event Listeners ---
        textInput.addEventListener('input', updateDisplayText);
        addSymbolBtn.addEventListener('click', () => {
            textInput.value += '₿';
            textInput.focus();
            updateDisplayText();
        });

        // --- Initial Load ---
        // The applySavedTheme function and its call have been removed.
        // The page now loads with the default CSS theme every time.
        updateDisplayText();

    </script>
</body>
</html>
